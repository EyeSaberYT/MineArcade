<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Orbit Launcher</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="css/shell.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/instance.css" />
    <link rel="stylesheet" href="css/discover.css" />
    <link rel="stylesheet" href="css/settings.css" />
    <link rel="stylesheet" href="css/friends.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <!-- Deep space behind every page: an aurora and two layers of slowly drifting stars. -->
    <div class="sky" aria-hidden="true"><div class="sky-stars"></div><div class="sky-stars far"></div></div>

    <div class="app">
      <!-- The window has no OS title bar: this frosted bar moves it (data-tauri-drag-region,
           double-click maximizes) and main.js adds minimize / maximize / close. -->
      <header class="topbar glass" data-tauri-drag-region>
        <a class="topbar-brand" href="#/" aria-label="Orbit Launcher home">
          <img class="brand-logo" src="assets/logo.png" alt="" />
          <span class="brand-name">Orbit Launcher</span>
        </a>
        <div class="topbar-arrows">
          <button class="topbar-arrow" id="nav-back" data-tip="Go back" aria-label="Go back">
            <svg class="icon icon-sm" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6" /></svg>
          </button>
        </div>
        <nav class="nav-tabs" id="nav" aria-label="Main">
          <a class="nav-tab" data-section="home" href="#/">Play</a>
          <a class="nav-tab" data-section="library" href="#/library">Library</a>
          <a class="nav-tab" data-section="discover" href="#/discover">Discover</a>
          <a class="nav-tab" data-section="friends" href="#/friends">Friends<span class="nav-badge" id="friends-badge"></span></a>
          <a class="nav-tab" data-section="settings" href="#/settings">Settings</a>
        </nav>
        <div class="topbar-fill" data-tauri-drag-region></div>
        <div class="topbar-status" id="topbar-actions"></div>
        <div id="account-box"></div>
        <div class="window-controls" id="window-controls" hidden></div>
      </header>

      <main class="main">
        <div class="view" id="view"></div>
        <div class="progress-footer glass" id="progress-footer" hidden></div>
      </main>
    </div>

    <div id="modals"></div>
    <div class="toasts" id="toasts"></div>
  </body>
</html>
