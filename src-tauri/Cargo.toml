[package]
name = "minearcade"
version = "0.1.0"
description = "MineArcade Minecraft launcher"
authors = ["MineArcade"]
edition = "2021"

[lib]
# The _lib suffix avoids a name clash between the lib and bin targets on Windows.
name = "minearcade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "charset"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
futures = "0.3"
anyhow = "1"
sha1 = "0.10"
hex = "0.4"
base64 = "0.22"
zip = { version = "2", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
dirs = "6"
open = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
